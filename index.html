<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給錢啊😎 - 智慧拍照分帳神器</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts: Noto Sans TC & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        /* 自訂捲軸 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        /* 掃描動畫 */
        @keyframes scanline {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
        .scan-overlay::after {
            content: '';
            position: absolute;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #f59e0b, #ef4444, transparent);
            box-shadow: 0 0 12px #f59e0b;
            animation: scanline 2s linear infinite;
        }
    </style>
</head>
<body class="text-slate-800 antialiased pb-24">

    <!-- 頂部導覽列 -->
    <header class="bg-gradient-to-r from-amber-500 via-orange-500 to-rose-500 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-3xl">💸</span>
                <div>
                    <h1 class="text-2xl font-black tracking-tight flex items-center">
                        給錢啊<span class="ml-1 text-2xl">😎</span>
                    </h1>
                    <p class="text-xs text-amber-100 font-medium">拍照秒拆帳，感情不會散</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openApiKeyModal()" id="apiKeyBtn" title="設定 AI 掃描金鑰" class="bg-white/20 hover:bg-white/30 active:bg-white/40 text-white text-xs font-bold py-2 px-3 rounded-xl transition flex items-center gap-1.5 backdrop-blur-sm">
                    <i class="fa-solid fa-key"></i> <span class="hidden sm:inline">AI 金鑰</span>
                    <span id="apiKeyStatusDot" class="w-2 h-2 rounded-full bg-amber-300"></span>
                </button>
                <button onclick="resetAll()" class="bg-white/20 hover:bg-white/30 active:bg-white/40 text-white text-xs font-bold py-2 px-3 rounded-xl transition flex items-center gap-1 backdrop-blur-sm">
                    <i class="fa-solid fa-rotate-right"></i> 重置
                </button>
            </div>
        </div>
    </header>

    <!-- API Key 設定彈窗 -->
    <div id="apiKeyModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-black text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-key text-amber-500"></i> 設定 Gemini API 金鑰
                </h3>
                <button onclick="closeApiKeyModal()" class="text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <p class="text-xs text-slate-500 leading-relaxed">
                若要使用 <strong>AI 拍照辨識帳單</strong> 功能，請填入您的免費 Google Gemini API Key（純手動分帳則不需設定）。
            </p>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">您的 Gemini API Key</label>
                <input type="password" id="customApiKeyInput" placeholder="貼上 AIzaSy 開頭的金鑰..."
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-amber-500">
                <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" class="inline-block text-[11px] font-bold text-blue-600 hover:underline mt-2">
                    <i class="fa-solid fa-up-right-from-square mr-1"></i>點此免費申請 Google Gemini API Key
                </a>
            </div>
            <div id="apiKeyValidationMsg" class="hidden text-xs font-bold py-2 px-3 rounded-xl"></div>
            <div class="flex gap-2 pt-2">
                <button type="button" onclick="clearCustomApiKey()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold py-2.5 px-3 rounded-xl text-xs transition">
                    清除
                </button>
                <button type="button" onclick="closeApiKeyModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-sm transition">
                    取消
                </button>
                <button type="button" id="saveApiKeyBtn" onclick="saveCustomApiKey()" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl text-sm transition">
                    確認儲存
                </button>
            </div>
        </div>
    </div>

    <!-- 主內容區 -->
    <main class="max-w-xl mx-auto px-4 pt-5 space-y-5">

        <!-- 區塊 1：參與人員與先墊錢設定 -->
        <section class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <span class="w-7 h-7 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-sm font-black">1</span>
                    這次有誰參加？
                </h2>
                <button onclick="toggleAddPerson()" class="text-xs font-bold text-amber-600 hover:text-amber-700 bg-amber-50 px-2.5 py-1.5 rounded-lg transition">
                    <i class="fa-solid fa-user-plus mr-1"></i>加新朋友
                </button>
            </div>

            <!-- 新增人員輸入框 (預設隱藏) -->
            <div id="addPersonBox" class="hidden flex gap-2">
                <input type="text" id="newPersonName" placeholder="輸入名字 (例如: 豪)" maxlength="6"
                    class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                <button onclick="addNewPerson()" class="bg-slate-800 text-white text-sm font-bold px-4 py-2 rounded-xl hover:bg-slate-700 transition">
                    新增
                </button>
            </div>

            <!-- 人員勾選列表 -->
            <div id="participantsList" class="flex flex-wrap gap-2.5">
                <!-- 由 JS 動態生成 -->
            </div>

            <hr class="border-slate-100">

            <!-- 誰先出錢 -->
            <div>
                <h2 class="text-base font-bold text-slate-800 flex items-center gap-2 mb-3">
                    <span class="w-7 h-7 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-sm font-black">2</span>
                    一開始誰先刷卡/付現？
                </h2>
                <div id="payerList" class="grid grid-cols-3 sm:grid-cols-4 gap-2">
                    <!-- 由 JS 動態生成 -->
                </div>
            </div>
        </section>

        <!-- 區塊 2：帳單拍照掃描 -->
        <section class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <span class="w-7 h-7 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-sm font-black">3</span>
                    帳單掃描 & 明細
                </h2>
                <span class="text-xs text-slate-400 font-medium">支援 AI 自動辨識</span>
            </div>

            <!-- 相機拍照與上傳按鈕區 -->
            <div class="grid grid-cols-2 gap-3">
                <!-- 呼叫手機相機拍照 -->
                <label class="cursor-pointer bg-gradient-to-br from-slate-800 to-slate-900 hover:from-slate-700 hover:to-slate-800 text-white rounded-2xl p-4 flex flex-col items-center justify-center gap-2 shadow-md transition active:scale-95">
                    <div class="w-10 h-10 rounded-full bg-white/15 flex items-center justify-center text-xl">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                    <span class="text-sm font-bold">相機拍帳單</span>
                    <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event)">
                </label>

                <!-- 從相簿選擇 -->
                <label class="cursor-pointer bg-slate-50 hover:bg-slate-100 border-2 border-dashed border-slate-300 text-slate-700 rounded-2xl p-4 flex flex-col items-center justify-center gap-2 transition active:scale-95">
                    <div class="w-10 h-10 rounded-full bg-slate-200/70 flex items-center justify-center text-xl text-slate-600">
                        <i class="fa-solid fa-image"></i>
                    </div>
                    <span class="text-sm font-bold">相簿選照片</span>
                    <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                </label>
            </div>

            <!-- 圖片預覽與掃描狀態 -->
            <div id="imagePreviewContainer" class="hidden relative rounded-2xl overflow-hidden border border-slate-200 bg-slate-900">
                <img id="receiptPreview" src="" alt="帳單預覽" class="w-full max-h-56 object-contain mx-auto opacity-90">
                <!-- 掃描中遮罩 -->
                <div id="scanningOverlay" class="hidden absolute inset-0 bg-slate-900/75 backdrop-blur-xs flex flex-col items-center justify-center text-white scan-overlay">
                    <i class="fa-solid fa-wand-magic-sparkles text-3xl text-amber-400 animate-bounce mb-2"></i>
                    <p class="font-bold text-sm tracking-wider">AI 正在努力辨識帳單明細...</p>
                    <p class="text-xs text-slate-300 mt-1">請稍候幾秒鐘</p>
                </div>
                <button onclick="clearImage()" class="absolute top-2 right-2 bg-black/60 text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-black/80 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- 消費明細列表 -->
            <div class="space-y-3 pt-2">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">消費項目清單 (<span id="itemCount">0</span>)</span>
                    <button onclick="addEmptyItem()" class="text-xs font-bold text-blue-600 hover:text-blue-700 bg-blue-50 px-3 py-1.5 rounded-xl transition flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> 手動加一筆
                    </button>
                </div>

                <!-- 明細卡片容器 -->
                <div id="itemsContainer" class="space-y-3">
                    <!-- 由 JS 動態生成 -->
                </div>
            </div>
        </section>

        <!-- 區塊 3：最終結算結果 -->
        <section class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white rounded-3xl p-6 shadow-xl space-y-5">
            <div class="flex items-center justify-between border-b border-slate-700/80 pb-4">
                <div>
                    <h2 class="text-lg font-black flex items-center gap-2">
                        <span>💰</span> 結算：誰該給誰多少錢
                    </h2>
                    <p class="text-xs text-slate-400 mt-0.5">已自動四捨五入至整數</p>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400 block">帳單總金額</span>
                    <span class="text-2xl font-black text-amber-400">$<span id="totalAmount">0</span></span>
                </div>
            </div>

            <!-- 轉帳指令卡片 -->
            <div id="settlementList" class="space-y-3">
                <!-- 由 JS 動態生成 -->
            </div>

            <!-- 個人消費明細折疊區 -->
            <div class="pt-2">
                <details class="group">
                    <summary class="text-xs font-bold text-slate-400 hover:text-white cursor-pointer flex items-center justify-between py-2 select-none">
                        <span><i class="fa-solid fa-receipt mr-1.5"></i>查看每個人各自點了多少錢</span>
                        <i class="fa-solid fa-chevron-down group-open:rotate-180 transition-transform"></i>
                    </summary>
                    <div id="individualBreakdown" class="mt-2 space-y-2 bg-slate-800/60 rounded-2xl p-3.5 text-sm">
                        <!-- 由 JS 動態生成 -->
                    </div>
                </details>
            </div>

            <!-- 複製結果按鈕 -->
            <button onclick="copySummary()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 active:scale-[0.99] text-slate-950 font-black py-3.5 px-4 rounded-2xl shadow-lg transition flex items-center justify-center gap-2 text-base">
                <i class="fa-regular fa-copy"></i> 複製催款明細貼到 LINE 群組
            </button>
        </section>

    </main>

    <!-- 隱藏的 Canvas 用於壓縮圖片以加快 AI 辨識 -->
    <canvas id="compressCanvas" class="hidden"></canvas>

    <!-- 自訂提示訊息 Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl text-sm font-bold flex items-center gap-2.5 opacity-0 pointer-events-none transition-all duration-300 z-50 border border-slate-700">
        <span id="toastIcon">✅</span>
        <span id="toastMsg">已複製到剪貼簿！</span>
    </div>

    <script>
        // ==========================================
        // 1. 狀態管理 (State)
        // ==========================================
        const DEFAULT_PEOPLE = [
            { id: 'p_yu', name: '煜', active: true, color: 'bg-amber-500' },
            { id: 'p_shan', name: '珊', active: true, color: 'bg-rose-500' },
            { id: 'p_jie', name: '杰', active: true, color: 'bg-blue-500' }
        ];

        const AVATAR_COLORS = [
            'bg-amber-500', 'bg-rose-500', 'bg-blue-500', 
            'bg-emerald-500', 'bg-purple-500', 'bg-cyan-500', 'bg-indigo-500'
        ];

        let state = {
            customApiKey: '',
            people: JSON.parse(JSON.stringify(DEFAULT_PEOPLE)),
            payerId: 'p_yu',
            items: [
                {
                    id: 'item_1',
                    name: '招牌豪華拼盤',
                    price: 450,
                    splitMode: 'all',
                    assignedIds: ['p_yu', 'p_shan', 'p_jie']
                },
                {
                    id: 'item_2',
                    name: '冰美式咖啡',
                    price: 120,
                    splitMode: 'custom',
                    assignedIds: ['p_shan']
                }
            ]
        };

        let activeResolvedModel = null;

        // ==========================================
        // 2. 初始化與核心渲染邏輯
        // ==========================================
        window.onload = function() {
            state.customApiKey = localStorage.getItem('gemini_api_key') || '';
            activeResolvedModel = localStorage.getItem('gemini_model_name') || null;
            updateApiKeyBadge();
            renderAll();
        };

        function updateApiKeyBadge() {
            const dot = document.getElementById('apiKeyStatusDot');
            const modelName = localStorage.getItem('gemini_model_name');
            if (!dot) return;
            if (state.customApiKey) {
                dot.className = 'w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_6px_#34d399]';
                dot.title = modelName ? `AI 金鑰已設定 (${modelName})` : 'AI 金鑰已設定';
            } else {
                dot.className = 'w-2 h-2 rounded-full bg-amber-300';
                dot.title = '尚未設定 AI 金鑰';
            }
        }

        function renderAll() {
            ensureValidPayer();
            renderParticipants();
            renderPayers();
            renderItems();
            calculateAndRenderSettlement();
        }

        function ensureValidPayer() {
            const activePeople = state.people.filter(p => p.active);
            if (activePeople.length === 0) {
                state.payerId = null;
                return;
            }
            const isPayerActive = activePeople.some(p => p.id === state.payerId);
            if (!isPayerActive) {
                state.payerId = activePeople[0].id;
            }
        }

        function renderParticipants() {
            const container = document.getElementById('participantsList');
            container.innerHTML = '';

            state.people.forEach(person => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => toggleParticipant(person.id);
                
                if (person.active) {
                    btn.className = `flex items-center gap-2 px-4 py-2.5 rounded-2xl font-bold text-sm transition shadow-xs border-2 border-slate-800 bg-slate-800 text-white active:scale-95`;
                    btn.innerHTML = `
                        <span class="w-5 h-5 rounded-full ${person.color} text-white text-xs flex items-center justify-center font-black">${person.name[0]}</span>
                        <span>${person.name}</span>
                        <i class="fa-solid fa-circle-check text-amber-400 ml-0.5"></i>
                    `;
                } else {
                    btn.className = `flex items-center gap-2 px-4 py-2.5 rounded-2xl font-bold text-sm transition border-2 border-slate-200 bg-slate-50 text-slate-400 hover:bg-slate-100 active:scale-95`;
                    btn.innerHTML = `
                        <span class="w-5 h-5 rounded-full bg-slate-300 text-white text-xs flex items-center justify-center font-black">${person.name[0]}</span>
                        <span>${person.name}</span>
                        <i class="fa-regular fa-circle ml-0.5"></i>
                    `;
                }
                container.appendChild(btn);
            });
        }

        function renderPayers() {
            const container = document.getElementById('payerList');
            container.innerHTML = '';
            const activePeople = state.people.filter(p => p.active);

            if (activePeople.length === 0) {
                container.innerHTML = `<p class="col-span-full text-xs text-rose-500 font-bold py-2">請至少選擇一位參加人員！</p>`;
                return;
            }

            activePeople.forEach(person => {
                const isSelected = state.payerId === person.id;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => {
                    state.payerId = person.id;
                    renderAll();
                };

                if (isSelected) {
                    btn.className = `flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-rose-500 bg-rose-50 text-rose-700 font-black text-sm shadow-xs transition active:scale-95`;
                    btn.innerHTML = `
                        <div class="flex items-center gap-1.5">
                            <i class="fa-solid fa-wallet text-rose-500"></i>
                            <span>${person.name}</span>
                        </div>
                        <span class="text-[10px] font-bold text-rose-500 mt-0.5">先墊錢</span>
                    `;
                } else {
                    btn.className = `flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 font-bold text-sm transition active:scale-95`;
                    btn.innerHTML = `
                        <span>${person.name}</span>
                        <span class="text-[10px] text-slate-400 mt-0.5">點擊切換</span>
                    `;
                }
                container.appendChild(btn);
            });
        }

        function renderItems() {
            const container = document.getElementById('itemsContainer');
            document.getElementById('itemCount').innerText = state.items.length;
            container.innerHTML = '';

            const activePeople = state.people.filter(p => p.active);

            if (state.items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 px-4 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                        <p class="text-slate-400 text-sm font-medium">目前還沒有消費明細喔！</p>
                        <p class="text-slate-400 text-xs mt-1">可以點擊上方「相機拍帳單」或「手動加一筆」</p>
                    </div>
                `;
                return;
            }

            state.items.forEach((item, index) => {
                const validAssigned = item.assignedIds.filter(id => activePeople.some(p => p.id === id));
                
                const card = document.createElement('div');
                card.className = 'bg-white rounded-3xl p-4 sm:p-5 border border-slate-200/90 shadow-xs hover:shadow-md hover:border-amber-300/80 space-y-3.5 transition-all duration-200';
                
                let splitCount = item.splitMode === 'all' ? activePeople.length : validAssigned.length;
                let perPersonText = splitCount > 0 && item.price > 0 
                    ? `每人 <span class="text-slate-800 font-black">$${Math.round(item.price / splitCount).toLocaleString()}</span>` 
                    : '<span class="text-rose-500">尚未指定分攤人</span>';

                let peopleButtonsHtml = '';
                activePeople.forEach(p => {
                    const isChecked = item.splitMode === 'all' || validAssigned.includes(p.id);
                    const btnStyle = isChecked 
                        ? `${p.color} text-white border-transparent shadow-xs` 
                        : `bg-white text-slate-400 border-slate-200 hover:bg-slate-100 hover:text-slate-600`;
                    
                    peopleButtonsHtml += `
                        <button type="button" onclick="toggleItemPerson('${item.id}', '${p.id}')"
                            class="px-3.5 py-1.5 rounded-xl text-xs font-bold border transition active:scale-95 flex items-center gap-1.5 ${btnStyle}">
                            <span>${p.name}</span>
                            ${isChecked ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
                        </button>
                    `;
                });

                card.innerHTML = `
                    <!-- 欄位優化：品項名稱獨立整排，超寬顯示 -->
                    <div class="space-y-1">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-400 flex items-center gap-1.5">
                                <span class="w-5 h-5 rounded-md bg-amber-500/15 text-amber-600 font-black flex items-center justify-center">${index + 1}</span>
                                品項名稱
                            </span>
                            <button type="button" onclick="deleteItem('${item.id}')" title="刪除項目"
                                class="text-slate-300 hover:text-rose-500 text-xs px-2 py-1 transition flex items-center gap-1">
                                <i class="fa-solid fa-trash-can"></i> 刪除
                            </button>
                        </div>
                        <input type="text" value="${escapeHtml(item.name)}" placeholder="輸入品項名稱 (例如：無骨牛小排拼盤、招牌珍奶)"
                            onchange="updateItemField('${item.id}', 'name', this.value)"

        function calculateAndRenderSettlement() {
            const activePeople = state.people.filter(p => p.active);
            const settlementContainer = document.getElementById('settlementList');
            const breakdownContainer = document.getElementById('individualBreakdown');
            
            let totalBill = 0;
            let personTotals = {};
            activePeople.forEach(p => personTotals[p.id] = 0);

            state.items.forEach(item => {
                const price = Number(item.price) || 0;
                totalBill += price;

                let sharers = [];
                if (item.splitMode === 'all') {
                    sharers = activePeople.map(p => p.id);
                } else {
                    sharers = item.assignedIds.filter(id => activePeople.some(p => p.id === id));
                }

                if (sharers.length > 0 && price > 0) {
                    const splitAmount = price / sharers.length;
                    sharers.forEach(id => {
                        personTotals[id] = (personTotals[id] || 0) + splitAmount;
                    });
                }
            });

            document.getElementById('totalAmount').innerText = Math.round(totalBill).toLocaleString();

            breakdownContainer.innerHTML = '';
            if (activePeople.length === 0) {
                breakdownContainer.innerHTML = '<p class="text-slate-400 text-xs">無參加人員</p>';
            } else {
                activePeople.forEach(p => {
                    const isPayer = p.id === state.payerId;
                    const amt = Math.round(personTotals[p.id] || 0);
                    breakdownContainer.innerHTML += `
                        <div class="flex items-center justify-between py-1 border-b border-slate-700/50 last:border-0">
                            <div class="flex items-center gap-2">
                                <span class="w-5 h-5 rounded-full ${p.color} text-white text-[10px] flex items-center justify-center font-black">${p.name[0]}</span>
                                <span class="font-bold text-slate-200">${p.name}</span>
                                ${isPayer ? '<span class="text-[10px] bg-rose-500/20 text-rose-300 px-1.5 py-0.5 rounded font-bold">先墊錢</span>' : ''}
                            </div>
                            <span class="font-black text-slate-100">$${amt.toLocaleString()}</span>
                        </div>
                    `;
                });
            }

            settlementContainer.innerHTML = '';
            const payer = activePeople.find(p => p.id === state.payerId);

            if (!payer || activePeople.length === 0) {
                settlementContainer.innerHTML = `<p class="text-sm text-slate-400 text-center py-3">請先選擇參加人員與墊錢的人</p>`;
                return;
            }

            let hasDebts = false;
            activePeople.forEach(p => {
                if (p.id === payer.id) return;
                const oweAmount = Math.round(personTotals[p.id] || 0);
                if (oweAmount > 0) {
                    hasDebts = true;
                    settlementContainer.innerHTML += `
                        <div class="bg-white/10 backdrop-blur-xs border border-white/10 rounded-2xl p-4 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="flex items-center gap-1.5">
                                    <span class="w-8 h-8 rounded-full ${p.color} text-white font-black flex items-center justify-center shadow">${p.name[0]}</span>
                                    <span class="font-black text-base">${p.name}</span>
                                </div>
                                <div class="flex flex-col items-center px-1 text-amber-400">
                                    <span class="text-[10px] font-bold tracking-wider">給錢啊</span>
                                    <i class="fa-solid fa-arrow-right-long"></i>
                                </div>
                                <div class="flex items-center gap-1.5">
                                    <span class="w-8 h-8 rounded-full ${payer.color} text-white font-black flex items-center justify-center shadow">${payer.name[0]}</span>
                                    <span class="font-black text-base">${payer.name}</span>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="text-xl font-black text-emerald-400">$${oweAmount.toLocaleString()}</span>
                            </div>
                        </div>
                    `;
                }
            });

            if (!hasDebts) {
                settlementContainer.innerHTML = `
                    <div class="bg-white/5 rounded-2xl p-4 text-center text-slate-400 text-sm">
                        🎉 目前沒有人需要額外付錢給 <strong class="text-white">${payer.name}</strong>！
                    </div>
                `;
            }
        }

        function toggleParticipant(id) {
            const person = state.people.find(p => p.id === id);
            if (!person) return;
            person.active = !person.active;

            const activeIds = state.people.filter(p => p.active).map(p => p.id);
            state.items.forEach(item => {
                if (item.splitMode === 'all') {
                    item.assignedIds = [...activeIds];
                } else {
                    item.assignedIds = item.assignedIds.filter(aid => activeIds.includes(aid));
                }
            });

            renderAll();
        }

        function toggleAddPerson() {
            const box = document.getElementById('addPersonBox');
            box.classList.toggle('hidden');
            if (!box.classList.contains('hidden')) {
                document.getElementById('newPersonName').focus();

        function addNewPerson() {
            const input = document.getElementById('newPersonName');
            const name = input.value.trim();
            if (!name) {
                showToast('請輸入朋友的名字喔！', '⚠️');
                return;
            }
            if (state.people.some(p => p.name === name)) {
                showToast('這個名字已經在名單裡囉！', '⚠️');

            }

            const color = AVATAR_COLORS[state.people.length % AVATAR_COLORS.length];
            const newId = 'p_' + Date.now();
            state.people.push({ id: newId, name: name, active: true, color: color });
            
            const activeIds = state.people.filter(p => p.active).map(p => p.id);
            state.items.forEach(item => {
                if (item.splitMode === 'all') {
                    item.assignedIds = [...activeIds];
                }

            document.getElementById('addPersonBox').classList.add('hidden');

        function addEmptyItem() {
            const activeIds = state.people.filter(p => p.active).map(p => p.id);
            state.items.push({
                id: 'item_' + Date.now() + Math.random().toString(36).substr(2, 4),
                name: '',
                price: 0,

        function updateItemField(itemId, field, value) {
            const item = state.items.find(i => i.id === itemId);
            if (item) {
                item[field] = value;
                renderItems();
                calculateAndRenderSettlement();
            }
        }

        function deleteItem(itemId) {
            state.items = state.items.filter(i => i.id !== itemId);
            renderAll();
        }

        function setItemSplitAll(itemId) {
            const item = state.items.find(i => i.id === itemId);
            if (!item) return;
            const activeIds = state.people.filter(p => p.active).map(p => p.id);
            item.splitMode = 'all';
            item.assignedIds = [...activeIds];
            renderItems();
            calculateAndRenderSettlement();
        }

        function toggleItemPerson(itemId, personId) {
            const item = state.items.find(i => i.id === itemId);
            if (!item) return;
            const activeIds = state.people.filter(p => p.active).map(p => p.id);

            if (item.splitMode === 'all') {
                item.splitMode = 'custom';
                item.assignedIds = activeIds.filter(id => id !== personId);
            } else {
                if (item.assignedIds.includes(personId)) {
                    item.assignedIds = item.assignedIds.filter(id => id !== personId);
                } else {
                    item.assignedIds.push(personId);
                }
                if (item.assignedIds.length === activeIds.length && activeIds.every(id => item.assignedIds.includes(id))) {
                    item.splitMode = 'all';
                }
            }

            renderItems();
            calculateAndRenderSettlement();
        }

        function resetAll() {
            state.people = JSON.parse(JSON.stringify(DEFAULT_PEOPLE));
            state.payerId = 'p_yu';
            state.items = [];
            clearImage();
            renderAll();
            showToast('已清空帳單，準備好開始新的一攤！', '✨');

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!state.customApiKey) {
                showToast('請先設定 Gemini API 金鑰方可使用掃描功能。', '🔑');
                openApiKeyModal();
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('compressCanvas');
                    const MAX_DIMENSION = 1600;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
                        if (width > height) {
                            height = Math.round((height * MAX_DIMENSION) / width);
                            width = MAX_DIMENSION;
                        } else {
                            width = Math.round((width * MAX_DIMENSION) / height);
                            height = MAX_DIMENSION;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    const base64Data = compressedDataUrl.split(',')[1];

                    document.getElementById('receiptPreview').src = compressedDataUrl;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                    document.getElementById('scanningOverlay').classList.remove('hidden');

                    scanReceiptWithGemini(base64Data);
                };
                img.onerror = function() {
                    showToast('圖片載入失敗，請重新選取。', '❌');
                };
                img.src = e.target.result;
            };
            reader.onerror = function() {
                showToast('檔案讀取失敗，請重新選取。', '❌');
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function clearCustomApiKey() {

            activeResolvedModel = null;
            localStorage.removeItem('gemini_api_key');
            localStorage.removeItem('gemini_model_name');
            document.getElementById('customApiKeyInput').value = '';

        async function fetchAvailableModels(apiKey) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;
            const res = await fetch(url);
            if (!res.ok) {
                let errText = `HTTP ${res.status}`;
                try {
                    const errJson = await res.json();
                    if (errJson?.error?.message) {
                        errText += `: ${errJson.error.message}`;
                    }
                } catch (_) {}
                throw new Error(errText);
            }
            const data = await res.json();
            return data.models || [];
        }

        function pickBestFlashModel(models) {
            const valid = models.filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'));
            if (valid.length === 0) return null;

            const priorities = [
                'gemini-2.5-flash',
                'gemini-flash-latest',
                'gemini-2.0-flash',
                'gemini-1.5-flash',
                'flash'
            ];

            for (const p of priorities) {
                const found = valid.find(m => m.name.toLowerCase().includes(p));
                if (found) return found.name;
            }

            return valid[0].name;
        }

        async function resolveActiveModel(apiKey) {
            if (activeResolvedModel) return activeResolvedModel;
            try {
                const models = await fetchAvailableModels(apiKey);
                const bestModel = pickBestFlashModel(models);
                if (bestModel) {
                    activeResolvedModel = bestModel;
                    localStorage.setItem('gemini_model_name', bestModel);
                    return bestModel;
                }
            } catch (err) {
                console.warn('動態獲取模型清單失敗，轉用備援清單：', err);
                if (err.message && (err.message.includes('403') || err.message.includes('API_KEY_INVALID'))) {
                    throw err;
                }
            }
            return 'models/gemini-2.5-flash';
        }

        async function saveCustomApiKey() {
            const input = document.getElementById('customApiKeyInput');
            const val = input.value.trim();
            const msgEl = document.getElementById('apiKeyValidationMsg');
            const saveBtn = document.getElementById('saveApiKeyBtn');

            if (!val) {
                clearCustomApiKey();
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerText = '驗證中...';
            msgEl.className = 'text-xs font-bold py-2.5 px-3 rounded-xl bg-amber-50 text-amber-700 flex items-center gap-1.5 border border-amber-200';
            msgEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 正在連線至 Google 伺服器驗證金鑰與支援模型...';
            msgEl.classList.remove('hidden');

            try {
                const models = await fetchAvailableModels(val);
                const bestModel = pickBestFlashModel(models);
                if (!bestModel) {
                    throw new Error('此金鑰有效，但未找到支援 generateContent 的模型。');
                }

                state.customApiKey = val;
                activeResolvedModel = bestModel;
                localStorage.setItem('gemini_api_key', val);
                localStorage.setItem('gemini_model_name', bestModel);

                const cleanModelName = bestModel.replace(/^models\//, '');
                msgEl.className = 'text-xs font-bold py-2.5 px-3 rounded-xl bg-emerald-50 text-emerald-700 flex items-center gap-1.5 border border-emerald-200';
                msgEl.innerHTML = `<i class="fa-solid fa-circle-check"></i> 驗證成功！已綁定模型：${cleanModelName}`;

                setTimeout(() => {
                    closeApiKeyModal();
                    updateApiKeyBadge();
                    showToast(`金鑰設定成功！使用模型：${cleanModelName}`, '🔑');
                }, 700);
            } catch (err) {
                console.error('金鑰驗證失敗：', err);
                let errText = err.message || '連線失敗';
                if (errText.includes('403') || errText.includes('API_KEY_INVALID')) {
                    errText = 'API 金鑰無效或尚未啟用 Gemini API 權限。';
                }
                msgEl.className = 'text-xs font-bold py-2.5 px-3 rounded-xl bg-rose-50 text-rose-700 flex items-center gap-1.5 border border-rose-200';
                msgEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> 驗證失敗：${errText}`;
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = '確認儲存';
            }
        }

        async function scanReceiptWithGemini(base64ImageData) {
            const activeApiKey = state.customApiKey;
            if (!activeApiKey) {
                showToast('請先設定 Gemini API 金鑰。', '🔑');
                openApiKeyModal();
                clearImage();
                return;
            }

            let modelToUse = activeResolvedModel || localStorage.getItem('gemini_model_name');
            if (!modelToUse) {
                try {
                    modelToUse = await resolveActiveModel(activeApiKey);
                } catch (err) {
                    console.error("無法取得模型：", err);
                    handleScanError(err);
                    document.getElementById('scanningOverlay').classList.add('hidden');
                    return;
                }
            }

            const candidateModels = [
                modelToUse,
                'models/gemini-2.5-flash',
                'models/gemini-flash-latest',
                'models/gemini-2.0-flash',
                'models/gemini-1.5-flash'
            ].filter((v, i, a) => v && a.indexOf(v) === i);

            let lastError = null;

            const prompt = `請仔細辨識這張收據或帳單照片中的所有消費項目與金額。
規則：
1. 萃取出每個單獨的消費品項名稱 (name) 與該項目的總金額 (price，純數字)。
2. 如果同一品項有數量大於1，請直接填入該項目的小計金額，並在名稱註明數量。
3. 如果有服務費、清潔費或外送費，也請列為一個獨立項目。
4. 忽略「總計」、「小計」、「找零」等非消費明細文字。
5. 請以 JSON 陣列格式回傳，格式範例：[{"name":"品項名稱","price":100}]。`;

            const payloadWithSchema = {
                contents: [
                    {
                        role: "user",
                        parts: [
                            { text: prompt },
                            {
                                inlineData: {
                                    mimeType: "image/jpeg",
                                    data: base64ImageData
                                }
                            }
                        ]
                    }
                ],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "ARRAY",
                        items: {
                            type: "OBJECT",
                            properties: {
                                "name": { "type": "STRING" },
                                "price": { "type": "NUMBER" }
                            },
                            required: ["name", "price"]
                        }
                    }
                }
            };

            for (const model of candidateModels) {
                const formattedModel = model.startsWith('models/') ? model : `models/${model}`;
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/${formattedModel}:generateContent?key=${activeApiKey}`;
                
                try {
                    let response = await fetchWithRetry(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payloadWithSchema)
                    });

                    // 若 400 且原因為 schema 不支援，退回純 Prompt 請求
                    if (!response.ok && response.status === 400) {
                        const fallbackPayload = {
                            contents: payloadWithSchema.contents,
                            generationConfig: {
                                temperature: 0.1
                            }
                        };
                        const fallbackResponse = await fetchWithRetry(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(fallbackPayload)
                        });
                        if (fallbackResponse.ok) {
                            response = fallbackResponse;
                        }
                    }

                    if (!response.ok) {
                        let errorDetail = `HTTP ${response.status}`;
                        try {
                            const errorJson = await response.json();
                            if (errorJson?.error?.message) {
                                errorDetail += ` (${errorJson.error.message})`;
                            }
                        } catch (_) {}
                        throw new Error(errorDetail);
                    }

                    const result = await response.json();
                    const jsonText = result?.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (!jsonText) throw new Error("API 未傳回明細文字。");

                    const parsedItems = cleanAndParseJson(jsonText);

                    if (Array.isArray(parsedItems) && parsedItems.length > 0) {
                        const activeIds = state.people.filter(p => p.active).map(p => p.id);
                        const newItems = parsedItems.map((item, idx) => ({
                            id: 'scan_' + Date.now() + '_' + idx,
                            name: item.name || '未命名品項',
                            price: Math.round(Number(item.price) || 0),
                            splitMode: 'all',
                            assignedIds: [...activeIds]
                        }));

                        state.items = [...state.items, ...newItems];
                        renderAll();
                        showToast(`成功辨識出 ${newItems.length} 筆明細！`, '🎉');
                        document.getElementById('scanningOverlay').classList.add('hidden');
                        return;
                    } else {
                        showToast('照片中未辨識到明確的明細項目，請手動新增。', '🤔');
                        document.getElementById('scanningOverlay').classList.add('hidden');
                        return;
                    }
                } catch (error) {
                    console.warn(`嘗試模型 ${model} 失敗：`, error);
                    lastError = error;
                    if (error.message && (error.message.includes('403') || error.message.includes('API_KEY_INVALID'))) {
                        break;
                    }
                }
            }

            console.error("Receipt scan final error:", lastError);
            handleScanError(lastError);
            document.getElementById('scanningOverlay').classList.add('hidden');
        }

        function cleanAndParseJson(text) {
            let str = text.trim();
            if (str.startsWith('```')) {
                str = str.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '').trim();
            }
            const bracketMatch = str.match(/\[\s*\{[\s\S]*\}\s*\]/);
            if (bracketMatch) {
                str = bracketMatch[0];
            }
            return JSON.parse(str);
        }

        function handleScanError(error) {
            const rawMsg = error?.message || '';
            if (rawMsg.includes('403') || rawMsg.includes('API_KEY_INVALID')) {
                showToast('API 金鑰無效或權限不足，請點擊右上角金鑰按鈕重新設定。', '❌');
                openApiKeyModal();
            } else if (rawMsg.includes('429')) {
                showToast('API 配額已達上限或呼叫頻率過高，請稍候重試。', '⚠️');
            } else if (rawMsg.includes('400')) {
                showToast('圖片規格過大或請求格式不符，請換張照片試試。', '❌');
            } else if (rawMsg.includes('404')) {
                showToast('找不到對應模型，請點擊右上角金鑰按鈕重新驗證金鑰。', '❌');
                openApiKeyModal();
            } else {
                showToast('辨識失敗：' + (rawMsg.length > 50 ? rawMsg.slice(0, 50) + '...' : rawMsg), '❌');
            }
        }

        async function fetchWithRetry(url, options, maxRetries = 3) {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return response;
                    if (response.status === 429 || response.status >= 500) {
                        await new Promise(res => setTimeout(res, delay));
                        delay *= 2;
                        continue;
                    }
                    return response;
                } catch (err) {
                    if (i === maxRetries - 1) throw err;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }
        }

        async function copySummary() {
            const activePeople = state.people.filter(p => p.active);
            const payer = activePeople.find(p => p.id === state.payerId);

            if (!payer || state.items.length === 0) {
                showToast('目前還沒有可以複製的帳單明細喔！', '⚠️');
                return;
            }

            let totalBill = 0;
            let personTotals = {};
            activePeople.forEach(p => personTotals[p.id] = 0);

            let itemLines = [];
            state.items.forEach(item => {
                const price = Number(item.price) || 0;
                totalBill += price;
                let sharers = item.splitMode === 'all' 
                    ? activePeople 
                    : activePeople.filter(p => item.assignedIds.includes(p.id));
                
                if (sharers.length > 0 && price > 0) {
                    const splitAmount = price / sharers.length;
                    sharers.forEach(p => personTotals[p.id] += splitAmount);
                }

                const whoText = item.splitMode === 'all' 
                    ? '全部人' 
                    : (sharers.length > 0 ? sharers.map(p => p.name).join('、') : '無人認領');
                itemLines.push(`• ${item.name || '品項'} $${price} (${whoText})`);
            });

            let debtLines = [];
            activePeople.forEach(p => {
                if (p.id === payer.id) return;
                const owe = Math.round(personTotals[p.id] || 0);
                if (owe > 0) {
                    debtLines.push(`👉 ${p.name} 給 ${payer.name}：$${owe}`);
                }
            });

            const summaryText = [
                `💸【給錢啊😎 分帳明細】`,
                `總金額：$${Math.round(totalBill)} (由 ${payer.name} 先墊付)`,
                `--------------------`,
                ...itemLines,
                `--------------------`,
                ...(debtLines.length > 0 ? debtLines : ['🎉 大家互不相欠！']),
                `快轉帳給 ${payer.name} 吧！😎`
            ].join('\n');

            let copied = false;
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(summaryText);
                    copied = true;
                } catch (e) {
                    copied = false;
                }
            }

            if (!copied) {
                const textarea = document.createElement('textarea');
                textarea.value = summaryText;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    copied = true;
                } catch (err) {
                    copied = false;
                }
                document.body.removeChild(textarea);
            }

            if (copied) {
                showToast('已複製分帳明細！快去群組貼上催款吧 😎', '📋');
            } else {
                showToast('複製失敗，請手動截圖分享', '❌');
            }
        }

        let toastTimer = null;
        function showToast(msg, icon = '✅') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').innerText = icon;
            
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 2800);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
